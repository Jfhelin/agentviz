<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGENTVIZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --av-bg-base: #f6f7fb;
      --av-bg-surface: #ffffff;
      --av-bg-hover: #e5e9f2;
      --av-bg-active: #d8deea;
      --av-focus: #6475e8;
      --av-border: #d8deea;
      --av-border-strong: #c2cad8;
      --av-text-primary: #141824;
      --av-text-secondary: #4f5669;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--av-bg-base);
      color: var(--av-text-primary);
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
    }

    html {
      background: var(--av-bg-base);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--av-border-strong);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--av-text-secondary);
    }

    *:focus-visible {
      outline: 2px solid var(--av-focus);
      outline-offset: 2px;
    }

    *:focus:not(:focus-visible) {
      outline: none;
    }

    /* Interactive button base class */
    .av-btn {
      cursor: pointer;
      transition: background 80ms ease-out, border-color 80ms ease-out, color 80ms ease-out;
    }

    .av-btn:hover {
      background: var(--av-bg-hover);
    }

    .av-btn:active {
      background: var(--av-bg-active);
    }

    /* Interactive row/card hover class */
    .av-interactive {
      transition: background 80ms ease-out;
    }

    .av-interactive:hover {
      background: var(--av-bg-hover);
    }

    /* Search input focus styling */
    .av-search:focus {
      border-color: var(--av-focus) !important;
      outline: none !important;
    }

    .av-search-wrap:focus-within {
      border-color: var(--av-focus) !important;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
